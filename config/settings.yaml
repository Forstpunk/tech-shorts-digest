lookback_days: 3          # how far back to look on the first run
max_short_seconds: 180    # YouTube Shorts can be up to 3 minutes
verify_shorts_url: false  # extra check against youtube.com/shorts/<id>; off by default
min_usefulness: 3         # drop items scored below this (1-5)
digest_size: 8
max_per_topic: 3
# Concept extraction is rule-based (no LLM); vocabulary and signals live in config/terms.yaml.
quota:
  daily_limit: 6000       # our own ceiling per day (Google's is 10,000); calls past it are refused
  curated_reserve: 500    # kept back for the curated fetch; discovery spends only what is left
# Discovery: a capped daily keyword search for small creators whose Shorts do unusually
# well for their size. Each search costs 100 quota units; at most 15 a day.
discovery:
  enabled: true
  max_searches_per_day: 15
  lookback_days: 7               # only Shorts published in the last N days
  relevance_language: en
  safe_search: moderate
  min_subscribers: 1000          # channel size window: small but real
  max_subscribers: 100000
  min_uploads: 5                 # skip brand-new / one-video channels
  min_views: 5000
  min_views_per_subscriber: 2.0  # "doing unusually well for its size"
  max_candidates_per_day: 20     # most that go on to extraction
  channel_stats_cache_days: 7
  languages: [en, hi]            # English + Hindi/Hinglish; judged by YouTube's language tag,
                                 # or by the title's script (Latin / Devanagari) when untagged
  keywords:                      # rotated round-robin if there are more than the daily cap
    - python trick
    - python tips
    - sql tip
    - excel hack
    - ai tool tutorial
    - chatgpt prompt tip
    - linux command
    - git tip
    - data engineering explained
    - vscode shortcut
    - developer humor
    - programming meme
    - coding joke
email:
  enabled: true           # send the digest after each `run` (needs the SMTP_* keys)
  send_when_empty: false  # no email on days when nothing passed the filters
